# Continuous integration.
#
# This runs the same gate CLAUDE.md asks for before a commit, plus one thing a
# developer machine cannot check: that a FRESH CLONE with an EMPTY DATABASE can
# migrate, seed, and build. Phases 6, 7 and 8 all built cleanly on the dev
# machine, pushed successfully, and failed on Vercel — the deployment had no
# DATABASE_URL, and public pages prerender from the database. Vercel kept
# serving the last good build, so the site looked healthy while running three
# phases behind. This job is the check that would have caught it.
#
# It is deliberately NOT a deployment gate — Vercel deploys from `main` on its
# own. This is the signal that tells you whether that deployment is going to
# work, and what branch protection on `main` should require.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      # A real Postgres, empty at the start of every run. The app's runtime
      # client uses @prisma/adapter-pg, so plain Postgres is what it talks to
      # anyway — Neon's difference is the pooler in front, not the engine.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_ci
        ports:
          - 5432:5432
        # Without this the first migration races the database's startup and
        # fails with a connection error that looks like a config problem.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Locally these are two different strings — pooled for the app, direct
      # for the CLI (see prisma.config.ts). There is no pooler here, so both
      # point at the same place. Set anyway, because a missing DIRECT_URL is
      # exactly the kind of gap this job exists to catch.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci
      # Not a secret and not reused anywhere: no session issued in CI is ever
      # honoured by a real deployment. The build needs the variable to exist.
      AUTH_SECRET: ci-only-placeholder-not-a-real-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # BLOB_READ_WRITE_TOKEN is deliberately absent. Storage is optional by
      # design, so the build must succeed without it — and it does, with the
      # admin's upload forms replaced by a "not configured" message.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # BEFORE typecheck, not as part of the build. The Prisma client is
      # generated into src/generated/ and gitignored, so on a fresh clone
      # `tsc` fails with "Cannot find module '@/generated/prisma/client'"
      # before it type-checks a single line of our own code. Needs no
      # database — see the note in prisma.config.ts.
      - name: Generate Prisma client
        run: npm run db:generate

      # Cheapest first, so a formatting slip does not wait on a build.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # From here on the database matters. `migrate deploy` applies the
      # committed migrations to an empty database, which is the one thing no
      # developer machine ever does — locally they were applied one at a time,
      # months apart, to a database that already had the previous state.
      - name: Apply migrations to an empty database
        run: npm run db:deploy

      - name: Seed
        run: npm run db:seed

      # Last, because it is the slowest and because it reads the database it
      # has just seeded. A build that passes here is a build that can prerender
      # against real rows.
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # End-to-end tests.
  #
  # A separate job, after Verify, for three reasons: it is much slower than the
  # gate above, its failures mean something different (a broken user journey
  # rather than a broken commit), and CI minutes are not worth spending driving
  # a browser through a commit that does not even typecheck.
  #
  # This is also the only place the suite runs unattended. Locally it needs
  # E2E_DATABASE_URL pointed at a throwaway database, because development and
  # production currently share one Neon database — see
  # tests/e2e/support/database.ts. Here the throwaway database is the whole
  # point of the service container, so there is nothing to be careful about.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Deliberately a different database name from the Verify job's. These
          # are separate containers in separate jobs and could not collide
          # anyway, but the name is what the e2e guard compares, and keeping
          # them distinct means the guard is never a step away from tripping.
          POSTGRES_DB: portfolio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # ONLY the E2E_ variables. DATABASE_URL is deliberately left unset: the
      # suite must never read it, and leaving it undefined here means that if
      # anything ever does, it fails loudly instead of quietly using the wrong
      # database. playwright.config.ts supplies the app's DATABASE_URL to the
      # server it starts, from these values.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_e2e
      E2E_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/portfolio_e2e
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Chromium only — see the note on `projects` in playwright.config.ts.
      # `--with-deps` installs the system libraries a headless browser needs,
      # which the GitHub runner does not have by default.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # This migrates and seeds the test database, builds, starts the server,
      # and runs the suite against it. All of that is in `e2e:server` and the
      # Playwright config rather than spelled out here, so that running the
      # tests locally and running them in CI are the same operation.
      - name: End-to-end tests
        run: npm run e2e

      # The report is how you find out WHAT failed without reproducing it
      # locally, so it is uploaded on failure — traces and screenshots included.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
